<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="Content-Security-Policy"
              content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'" />
        <title>Scanned Dictionary Browser</title>
        <link rel="stylesheet" href="scripts/vendor/bootstrap.min.css" />
        <link rel="stylesheet" href="scripts/dictionary.css" />
        <script src="scripts/base.js"></script>
        <script src="scripts/manifest.js"></script>
    </head>
    <body>
        <div id="topbar" class="d-flex align-items-center gap-2 p-2 bg-light border-bottom">
            <input type="search" id="search" class="form-control flex-grow-1" placeholder="Search..." autocomplete="off" autofocus />
            <div id="pager" class="d-flex gap-2 flex-shrink-0">
                <button id="prev" type="button" class="btn btn-outline-secondary">&laquo; Previous</button>
                <button id="next" type="button" class="btn btn-outline-secondary">Next &raquo;</button>
            </div>
            <select id="dict-select" class="form-select w-auto flex-shrink-0"></select>
        </div>
        <div id="main">
            <div id="viewport">
                <img id="page" draggable="false" alt="Dictionary page" />
            </div>
        </div>
    </body>
</html>
